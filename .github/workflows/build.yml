name: Build and Publish Geocoder Image

on:
  schedule:
    # Monthly, on the 15th at 03:00 UTC, from fresh Geofabrik extracts. KIVO's
    # geocoder-bump.yml picks the result up on the 16th. Addresses change
    # slowly, and a build takes over two hours of runner time.
    - cron: '0 3 15 * *'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: geocoder-build
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/geocoder

jobs:
  build:
    name: Build & Publish Image
    runs-on: ${{ vars.ci_runner_large || 'ubuntu-latest' }}
    # 30 countries: the build step took 135 minutes on a 4-core runner, of
    # which the pack 124. GitHub-hosted jobs stop at 6 hours.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      # The Dockerfile pins the open-geocode repository and commit: a monthly
      # build refreshes the map, never the code, so a reviewed commit cannot
      # be swapped for an unreviewed one by the schedule.
      - name: Read pinned open-geocode ref
        id: og_ref
        run: |
          ref=$(sed -n 's/^ARG OPEN_GEOCODE_REF=//p' Dockerfile)
          if ! [[ "${ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Dockerfile does not pin OPEN_GEOCODE_REF to a 40-character commit"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "short_ref=${ref:0:7}" >> "$GITHUB_OUTPUT"

      - name: Get current date tag
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # One build: the binary, one download stage per country (in parallel),
      # the pack, then the runtime. Plain `docker build` on the runner's own
      # daemon, so the image lands in the local store the smoke test runs.
      # OSM_DATE makes every run download fresh extracts instead of reusing a
      # cached layer.
      - name: Build image
        run: |
          docker build \
            --tag geocoder:local-test \
            --build-arg "OSM_DATE=${{ steps.date.outputs.date }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .
          docker image ls geocoder:local-test
          df -h /

      - name: Smoke test local image
        run: |
          docker run -d --name test-geocoder -p 8080:8080 geocoder:local-test

          ready=false
          for i in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              ready=true
              echo "Geocoder became ready in ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Geocoder failed to become ready within 60s"
            docker logs test-geocoder
            exit 1
          fi

          root_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          [ "$root_code" = "404" ] || { echo "::error::Expected 404 from /, got $root_code"; exit 1; }

          # One address per country. Every check runs before the step fails,
          # so a run shows every country that does not answer, not just the
          # first. The street and the town are matched against the answer's
          # own fields, not just its label, which leaves the town out in some
          # countries. Both must match: a rooftop hit on another street
          # (`Rua Augusta 1` once returned Rua Augusto Rosa) or in another
          # town (`Grand-Rue 1, Luxembourg` once returned Wasserbillig) is a
          # wrong answer, not a match. Every address below exists in
          # OpenStreetMap with its house number. `rooftop` marks the checks
          # that also need the exact house.
          failed=0
          check() {
            local q="$1" street="$2" town="$3" need="${4:-}" lang="${5:-}"
            local res
            if ! res=$(curl -sSf --get --data-urlencode "q=${q}" --data limit=1 ${lang:+--data "lang=${lang}"} http://127.0.0.1:8080/geocode); then
              echo "::error::${q}: request failed"
              failed=1
              return
            fi
            echo "${q} -> $(jq -c '.features[0].properties | {label, accuracy, street: .address.street, locality: (.address.locality // .context.locality.name)}' <<<"${res}")"
            if ! jq -e --arg s "${street}" --arg t "${town}" --arg need "${need}" '
                (.features | length > 0)
                and (.features[0].properties as $p
                  | ([$p.address.street, $p.name, $p.label] | map(strings) | join(" | ") | contains($s))
                  and ([$p | .. | strings] | join(" | ") | contains($t))
                  and ($need == "" or $p.accuracy == $need))' <<<"${res}" >/dev/null; then
              echo "::error::${q} did not resolve to ${street}, ${town} ${need}"
              failed=1
            fi
          }
          check "Chaussestraße 111, 10115 Berlin" "Chausseestraße" "Berlin" rooftop
          check "Gran Vía 28, 28013 Madrid" "Gran Vía" "Madrid" rooftop
          check "Getreidegase 9, 5020 Salzburg" "Getreidegasse" "Salzburg" rooftop
          check "Bahnhofstrasse 10, 8001 Zürich" "Bahnhofstrasse" "Zürich" rooftop
          check "Rue de Rivoli 99, 75001 Paris" "Rue de Rivoli" "Paris"
          check "Avenue Louise 54, 1050 Bruxelles" "Avenue Louise" "Bruxelles" rooftop
          check "Damrak 1, 1012 Amsterdam" "Damrak" "Amsterdam" rooftop
          check "Rue du Marché-aux-Herbes 17, Luxembourg" "Marché-aux-Herbes" "Luxembourg"
          check "10 Downing Street, London" "Downing Street" "Westminster"
          check "Royal Avenue 1, Belfast" "Royal Avenue" "Belfast"
          check "Grafton Street, Dublin" "Grafton Street" "Dublin"
          check "Via del Corso 1, 00186 Roma" "Via del Corso" "Roma"
          check "Nowy Świat 1, 00-496 Warszawa" "Nowy Świat" "Warszawa"
          check "Rua Augusta 100, Lisboa" "Rua Augusta" "Lisboa"
          check "Václavské náměstí 1, Praha" "Václavské náměstí" "Praha"
          check "Hlavné námestie 1, Bratislava" "Hlavné námestie" "Bratislava"
          check "Andrássy út 1, Budapest" "Andrássy út" "Budapest"
          check "Prešernov trg 1, Ljubljana" "Prešernov trg" "Ljubljana"
          check "Ilica 1, Zagreb" "Ilica" "Zagreb"
          check "Calea Victoriei 1, București" "Calea Victoriei" "București"
          check "бул. Витоша 1, София" "Витоша" "София"
          check "Ερμού 1, Αθήνα" "Ερμού" "Αθήνα"
          check "Λεωφόρος Μακαρίου 1, Λευκωσία" "Μακαρίου" "Λευκωσία"
          check "Triq ir-Repubblika 1, Valletta" "Repubblika" "Valletta"
          check "Amagertorv 1, København" "Amagertorv" "København"
          check "Drottninggatan 1, Stockholm" "Drottninggatan" "Stockholm"
          check "Karl Johans gate 1, Oslo" "Karl Johans gate" "Oslo"
          check "Mannerheimintie 1, Helsinki" "Mannerheimintie" "Helsinki"
          check "Viru 1, Tallinn" "Viru" "Tallinn"
          check "Kaļķu iela 1, Rīga" "Kaļķu iela" "Rīga"
          check "Gedimino prospektas 1, Vilnius" "Gedimino" "Vilnius"
          # `lang` answers in Spanish where the map's street is Valencian: the
          # Spanish tax register writes `Calle del Almirante Cadarso`, the
          # map's own `addr:street` is `Carrer de l'Almirall Cadarso`. Judged
          # on the first house of the answer, not on `features[0]`: in the full
          # pack a street of that name ranks above its house, and the
          # translation is what is tested here, not the rank.
          house() {
            curl -sSf --get --data-urlencode "q=Almirante Cadarso 26, 46005 Valencia" \
              --data country=ES --data layer=address --data limit=5 "$@" \
              http://127.0.0.1:8080/geocode \
              | jq -c '[.features[] | select(.properties.layer == "address")][0].properties.address.street // empty'
          }
          if [ "$(house --data lang=es)" != '"Calle del Almirante Cadarso"' ]; then
            echo "::error::lang=es did not give Calle del Almirante Cadarso for Almirante Cadarso 26, Valencia"
            failed=1
          fi
          if [ "$(house)" != "\"Carrer de l'Almirall Cadarso\"" ]; then
            echo "::error::without lang the map's own street name was not Carrer de l'Almirall Cadarso"
            failed=1
          echo "lang=es street: $(house --data lang=es)"

          docker stats --no-stream --format 'serving memory after the checks: {{.MemUsage}}' test-geocoder
          docker stop test-geocoder
          docker rm test-geocoder
          exit "${failed}"

      # tests but publishes nothing, so it cannot move `latest`.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          # The data tag carries the run id: the date alone repeats when a
          # second run happens the same day, and a tag must name one build.
          DATE="${{ steps.date.outputs.date }}-${{ github.run_id }}"
          OG_TAG="${{ steps.og_ref.outputs.short_ref }}"
          docker tag geocoder:local-test "${IMAGE_NAME}:latest"
          docker tag geocoder:local-test "${IMAGE_NAME}:sha-${{ github.sha }}"
          docker tag geocoder:local-test "${IMAGE_NAME}:data-${DATE}"
          docker tag geocoder:local-test "${IMAGE_NAME}:og-${OG_TAG}"

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${{ github.sha }}"
          docker push "${IMAGE_NAME}:data-${DATE}"
          docker push "${IMAGE_NAME}:og-${OG_TAG}"
          echo "Successfully pushed verified image tags: latest, sha-${{ github.sha }}, data-${DATE}, og-${OG_TAG}"
