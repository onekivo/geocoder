name: Build and Publish Geocoder Image

on:
  schedule:
    # Weekly rebuild with latest OSM data extracts (Sundays at 03:00 UTC)
    - cron: '0 3 * * 0'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      open_geocode_ref:
        description: 'open-geocode git ref or commit SHA (leave empty for latest CI-green on main)'
        required: false
        default: ''

concurrency:
  group: geocoder-build
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/geocoder

jobs:
  build:
    name: Build & Publish Image
    runs-on: ${{ vars.ci_runner_large || 'ubuntu-latest' }}
    # Ten countries: about 18 GB of downloads, then the pack. GitHub-hosted
    # jobs stop at 6 hours.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Resolve latest open-geocode ref
        id: og_ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.open_geocode_ref }}
        run: |
          if [ -n "${INPUT_REF}" ]; then
            echo "Using manual input ref: ${INPUT_REF}"
            echo "ref=${INPUT_REF}" >> "$GITHUB_OUTPUT"
            echo "short_ref=${INPUT_REF:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "Querying latest CI-green commit on open-geocode main branch..."
            latest_sha=$(gh api 'repos/open-geocode-rs/open-geocode/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1' --jq '.workflow_runs[0].head_sha')
            if [ -z "${latest_sha}" ]; then
              echo "::error::Failed to resolve latest CI-green commit from open-geocode-rs/open-geocode"
              exit 1
            fi
            echo "Resolved latest CI-green ref: ${latest_sha}"
            echo "ref=${latest_sha}" >> "$GITHUB_OUTPUT"
            echo "short_ref=${latest_sha:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current date tag
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # One build: the binary, one download stage per country (in parallel),
      # the pack, then the runtime. Plain `docker build` on the runner's own
      # daemon, so the image lands in the local store the smoke test runs.
      # OSM_DATE makes every run download fresh extracts instead of reusing a
      # cached layer.
      - name: Build image
        run: |
          docker build \
            --tag geocoder:local-test \
            --build-arg "OPEN_GEOCODE_REF=${{ steps.og_ref.outputs.ref }}" \
            --build-arg "OSM_DATE=${{ steps.date.outputs.date }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .
          docker image ls geocoder:local-test
          df -h /

      - name: Smoke test local image
        run: |
          docker run -d --name test-geocoder -p 8080:8080 geocoder:local-test

          ready=false
          for i in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              ready=true
              echo "Geocoder became ready in ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Geocoder failed to become ready within 60s"
            docker logs test-geocoder
            exit 1
          fi

          root_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          [ "$root_code" = "404" ] || { echo "::error::Expected 404 from /, got $root_code"; exit 1; }

          # One address per country. Every check runs before the step fails,
          # so a run shows every country that does not answer, not just the
          # first. `rooftop` marks the checks that also require the exact
          # house to be in the data.
          failed=0
          check() {
            local q="$1" street="$2" need="${3:-}"
            local res
            res=$(curl -sSf --get --data-urlencode "q=${q}" --data limit=1 http://127.0.0.1:8080/search)
            echo "${q} -> $(jq -c '.features[0].properties | {label, accuracy}' <<<"${res}")"
            if ! jq -e --arg s "${street}" --arg need "${need}" '
                (.features | length > 0)
                and (.features[0].properties.label | contains($s))
                and ($need == "" or .features[0].properties.accuracy == $need)' <<<"${res}" >/dev/null; then
              echo "::error::${q} did not resolve to ${street} ${need}"
              failed=1
            fi
          }
          check "Chaussestraße 111, 10115 Berlin" "Chausseestraße" rooftop
          check "Gran Vía 28, 28013 Madrid" "Gran Vía" rooftop
          check "Getreidegase 9, 5020 Salzburg" "Getreidegasse" rooftop
          check "Bundesplatz 3, 3005 Bern" "Bundesplatz"
          check "Rue de Rivoli 99, 75001 Paris" "Rue de Rivoli"
          check "Grand-Place 1, 1000 Bruxelles" "Grand-Place"
          check "Dam 1, 1012 Amsterdam" "Dam"
          check "Rue du Marché-aux-Herbes 17, Luxembourg" "Marché-aux-Herbes"
          check "10 Downing Street, London" "Downing Street"
          check "Royal Avenue 1, Belfast" "Royal Avenue"
          check "Grafton Street, Dublin" "Grafton Street"

          docker stats --no-stream --format 'serving memory after the checks: {{.MemUsage}}' test-geocoder
          docker stop test-geocoder
          docker rm test-geocoder
          exit "${failed}"

      # A run on any other branch (dispatched to try a change) builds and
      # tests but publishes nothing, so it cannot move `latest`.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          OG_TAG="${{ steps.og_ref.outputs.short_ref }}"
          docker tag geocoder:local-test "${IMAGE_NAME}:latest"
          docker tag geocoder:local-test "${IMAGE_NAME}:sha-${{ github.sha }}"
          docker tag geocoder:local-test "${IMAGE_NAME}:data-${DATE}"
          docker tag geocoder:local-test "${IMAGE_NAME}:og-${OG_TAG}"

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${{ github.sha }}"
          docker push "${IMAGE_NAME}:data-${DATE}"
          docker push "${IMAGE_NAME}:og-${OG_TAG}"
          echo "Successfully pushed verified image tags: latest, sha-${{ github.sha }}, data-${DATE}, og-${OG_TAG}"
